name: LoFiRoom
options:
  bundleIdPrefix: com.lofiroom
  deploymentTarget:
    iOS: "26.0"
packages:
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    exactVersion: 5.0.1
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}  # from the environment; see README
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "2"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LoFiRoom:
    type: application
    platform: iOS
    sources:
      - path: LoFiRoom
        excludes: [Assets]
      # Folder reference: packs keep their directory layout in the bundle, so adding a pack is adding a folder.
      - path: LoFiRoom/Assets
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lofiroom.app
        SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}  # from the environment; see CLAUDE.local.md
    info:
      path: LoFiRoom/Info.plist
      properties:
        CFBundleDisplayName: Lo-Fi Room
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIRequiresFullScreen: true
        # Spotify App Remote spike: callback scheme, permission to open Spotify, client ID from the environment
        CFBundleURLTypes:
          - CFBundleURLSchemes: [lofiroom]
        LSApplicationQueriesSchemes: [spotify]
        SpotifyClientID: $(SPOTIFY_CLIENT_ID)
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: SpotifyiOS
    scheme:
      testTargets: [LoFiRoomTests]
  LoFiRoomTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoFiRoomTests
      # Packs exported from .aseprite sources; tested on the device without shipping in the app.
      - path: ArtLab/aseprite/out
        type: folder
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LoFiRoom
